name: Autonomous agent loop

on:
  schedule:
    # Keep the agent working every day, not just for one 18-hour window.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: koki-agent-loop
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate scheduler configuration
        env:
          AGENT_URL: ${{ vars.KOKI_AGENT_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$AGENT_URL" || { echo "::error::Set repository variable KOKI_AGENT_URL to the deployed Koki base URL."; exit 1; }
          test -n "$CRON_SECRET" || { echo "::error::Set repository secret CRON_SECRET and use the same value in Vercel."; exit 1; }

      - name: Execute agent cycle
        env:
          AGENT_URL: ${{ vars.KOKI_AGENT_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -eu
          curl --fail-with-body --silent --show-error --max-time 75 \
            --request POST "${AGENT_URL%/}/api/agent/loop" \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            --header "Content-Type: application/json" \
            --data '{}'
