name: Autonomous agent loop

on:
  schedule:
    # The agent operates every day; 18 hours is the target window, not a shutdown.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: koki-agent-loop
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Validate scheduler configuration
        env:
          # Use the repository variable when set; otherwise use the production alias.
          AGENT_URL: ${{ vars.KOKI_AGENT_URL || 'https://koki-blush.vercel.app' }}
        run: |
          test -n "$AGENT_URL" || { echo "::error::Agent URL is empty."; exit 1; }

      - name: Request short-lived GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -eu
          response="$(curl --fail --silent --show-error --get \
            --data-urlencode "audience=koki-agent" \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}")"
          token="$(printf '%s' "$response" | jq -er '.value')"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Verify production agent readiness
        env:
          AGENT_URL: ${{ vars.KOKI_AGENT_URL || 'https://koki-blush.vercel.app' }}
        run: |
          set -eu
          curl --fail-with-body --silent --show-error --max-time 20 \
            "${AGENT_URL%/}/api/agent/health"

      - name: Execute market evaluation cycle
        env:
          AGENT_URL: ${{ vars.KOKI_AGENT_URL || 'https://koki-blush.vercel.app' }}
          GH_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -eu
          curl --fail-with-body --silent --show-error --max-time 75 \
            --request POST "${AGENT_URL%/}/api/agent/loop" \
            --header "Authorization: Bearer ${GH_OIDC_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{}'

      - name: Reconcile confirmed treasury fee claims
        env:
          AGENT_URL: ${{ vars.KOKI_AGENT_URL || 'https://koki-blush.vercel.app' }}
          GH_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -eu
          curl --fail-with-body --silent --show-error --max-time 75 \
            --request POST "${AGENT_URL%/}/api/agent/fees/reconcile" \
            --header "Authorization: Bearer ${GH_OIDC_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{}'
