name: Autonomous agent loop

on:
  schedule:
    # The agent operates every day; 18 hours is the target window, not a shutdown.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: koki-agent-loop
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Validate scheduler configuration
        env:
          # Use the repository variable when set; otherwise use the production alias.
          AGENT_URL: ${{ vars.KOKI_AGENT_URL || 'https://koki-blush.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$AGENT_URL" || { echo "::error::Set repository variable KOKI_AGENT_URL or update the fallback URL."; exit 1; }
          test -n "$CRON_SECRET" || { echo "::error::Set repository secret CRON_SECRET and use the same value in Vercel."; exit 1; }

      - name: Execute market evaluation cycle
        env:
          AGENT_URL: ${{ vars.KOKI_AGENT_URL || 'https://koki-blush.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -eu
          curl --fail-with-body --silent --show-error --max-time 75 \
            --request POST "${AGENT_URL%/}/api/agent/loop" \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            --header "Content-Type: application/json" \
            --data '{}'

      - name: Reconcile confirmed treasury fee claims
        env:
          AGENT_URL: ${{ vars.KOKI_AGENT_URL || 'https://koki-blush.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -eu
          curl --fail-with-body --silent --show-error --max-time 75 \
            --request POST "${AGENT_URL%/}/api/agent/fees/reconcile" \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            --header "Content-Type: application/json" \
            --data '{}'
