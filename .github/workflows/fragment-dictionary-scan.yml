name: Fragment dictionary username scan

on:
  push:
    branches: [main]
    paths:
      - "scripts/fragment-dictionary-scan.mjs"
      - ".github/workflows/fragment-dictionary-scan.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      scan_limit:
        description: "Dictionary words to check in this run (max recommended 4500)"
        required: false
        default: "100"

permissions:
  contents: write

concurrency:
  group: fragment-dictionary-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan next dictionary chunk
        env:
          SCAN_LIMIT: ${{ github.event.inputs.scan_limit || '100' }}
        run: node scripts/fragment-dictionary-scan.mjs
      - name: Commit scan progress and results
        if: always()
        run: |
          if git status --porcelain | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/fragment-dictionary-scan/
            git commit -m "Update Fragment dictionary scan results" || true
            git push origin HEAD:main
          fi
