name: Check pluralized Fragment usernames

on:
  push:
    branches: [main]
    paths:
      - "scripts/fragment-plural-scan.mjs"
      - ".github/workflows/fragment-plural-scan.yml"
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "New source words to check in this run (max 1000)"
        required: false
        default: "1000"

permissions:
  contents: write

concurrency:
  group: fragment-plural-scan
  cancel-in-progress: false

jobs:
  check-plurals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check next batch of pluralized usernames
        env:
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '1000' }}
        run: node scripts/fragment-plural-scan.mjs
      - name: Save cumulative results and unknown-only list
        if: always()
        run: |
          if git status --porcelain | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/fragment-dictionary-scan/plural-results/
            git commit -m "Save pluralized Telegram username batch results" || true
            git push origin HEAD:main
          fi
